name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runperch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflows
        run: '"$(go env GOPATH)/bin/actionlint"'
  native:
    name: ${{ matrix.os }} / shared app and contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: clang_64
          - os: windows-2022
            arch: win64_msvc2022_64
          - os: ubuntu-24.04
            arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          cache: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: UI test report
        if: always()
        run: cmake -E cat build/ui-results.txt
      - name: Core test report
        if: always()
        run: cmake -E cat build/core-results.txt
